<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>WeatherMap</h1>
        <p class="subtitle">search for any city on the world to see its weather on the map!</p>
    </header>

    <main>
        <form id="search-form" class="search" autocomplete="off" novalidate>
            <div class="search-area">
                <label for="city">City name</label>
                <input id="city" type="text" placeholder="Search for a city.. e.g.London">
            </div>
            <button id="search-btn" type="submit" class="btn">Get Weather!</button>
        </form>
        <div class="map-wrap">
          <div id="map"></div>
          <div id="loader" class="loader" hidden>
            <div class="spinner"></div>
            <span>Loading weather...</span>
          </div>
    </div>
    </main>

    <footer>
        <span>Weather Data by OpenWeatherMap &middot; Map by OpenStreetMap &amp; Leaflet</span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
